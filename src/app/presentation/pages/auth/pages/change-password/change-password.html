<div class="change-password-page">
  <div class="change-password-page__container">
    @if (token()) {
      <!-- Password Reset Form Container -->
      <div class="change-password-page__form-container">
        <app-reset-password-form [auth]="auth()" [token]="token()" />
      </div>
    } @else {
      <!-- Enhanced Error State -->
      <div class="change-password-page__error">
        <!-- Error Icon -->
        <div class="change-password-page__error-icon">
          <ui-icon name="outline/error" size="lg" />
        </div>

        <!-- Error Content -->
        <h2>Token inválido o expirado</h2>
        <p>
          El enlace de restablecimiento de contraseña no es válido o ha expirado. Por favor,
          solicita un nuevo enlace para continuar.
        </p>

        <!-- Enhanced Link -->
        <a routerLink="/auth/reset-password" class="change-password-page__link">
          <ui-icon name="outline/link" size="sm" />
          Solicitar nuevo enlace
        </a>
      </div>
    }
  </div>
</div>

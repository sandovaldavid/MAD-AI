<section class="dashboard-container">
  <!-- Header Section -->
  <app-page-header [config]="headerConfig()" />

  <!-- Form Content -->
  <div class="dashboard-content">
    @if (facade.loading()) {
      <!-- Loading State -->
      <div class="max-w-2xl mx-auto">
        <div
          class="bg-white dark:bg-neutral-900 rounded-lg shadow-sm border border-neutral-200 dark:border-neutral-700">
          <div class="p-6">
            <div class="animate-pulse space-y-4">
              <div class="h-4 bg-neutral-200 dark:bg-neutral-700 rounded w-1/4"></div>
              <div class="h-10 bg-neutral-200 dark:bg-neutral-700 rounded"></div>
              <div class="h-4 bg-neutral-200 dark:bg-neutral-700 rounded w-1/3"></div>
              <div class="h-10 bg-neutral-200 dark:bg-neutral-700 rounded"></div>
            </div>
          </div>
        </div>
      </div>
    } @else if (!currentRole()) {
      <!-- Error State - Role not found -->
      <div class="max-w-2xl mx-auto">
        <app-error-display [config]="errorConfig()" />
      </div>
    } @else {
      <!-- Edit Form -->
      <div class="max-w-4xl mx-auto">
        <div
          class="bg-white dark:bg-neutral-900 rounded-lg shadow-sm border border-neutral-200 dark:border-neutral-700">
          <div class="p-6">
            <h2 class="text-lg font-semibold text-neutral-900 dark:text-neutral-100 mb-4">
              Editar Información del Rol
            </h2>

            <app-role-form
              [mode]="'edit'"
              [loading]="facade.loading()"
              [initialData]="currentRole() || undefined"
              (submitted)="onRoleUpdated($event)"
              (cancelled)="onCancel()">
            </app-role-form>
          </div>
        </div>
      </div>
    }
  </div>
</section>

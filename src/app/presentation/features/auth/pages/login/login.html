<div class="container-centered gradient-container">
    <!-- Left Side - Form -->
    <div class="container-form">
        <div class="card-responsive">
            <div class="card-auth-form shadow-form-elevated">
                <!-- Brand Header -->
                <div class="text-center mb-6">
                    <h1
                        class="text-2xl lg:text-3xl font-bold text-neutral-900 dark:text-white mb-2">
                        Bienvenido de vuelta
                    </h1>
                    <p class="text-neutral-600 dark:text-neutral-300 text-sm lg:text-base">
                        Inicia sesión en tu cuenta para continuar
                    </p>
                </div>

                <!-- Login Form -->
                <app-login-form [auth]="auth" />

                <!-- Footer -->
                <div class="mt-3 pt-4 border-t border-neutral-200 dark:border-neutral-700">
                    <p class="text-center text-xs text-neutral-500 dark:text-neutral-400">
                        Al continuar, aceptas nuestros
                        <a
                            href="#"
                            class="text-primary-600 hover:text-primary-700 dark:text-primary-400 underline focus-ring rounded">
                            Términos de Servicio
                        </a>
                        y
                        <a
                            href="#"
                            class="text-primary-600 hover:text-primary-700 dark:text-primary-400 underline focus-ring rounded">
                            Política de Privacidad
                        </a>
                    </p>
                </div>
            </div>
        </div>
    </div>

    <!-- Right Side - Image and Branding -->
    <div class="container-image bg-gradient-to-br from-primary-500 to-secondary-600 w-full h-full">
        <div
            class="image-overlay w-full h-full overflow-hidden flex justify-center items-center flex-col">
            <img
                src="/bg-placeholder.jpg"
                alt="Plataforma MAD-AI"
                class="object-fill h-[400px] w-full"
                loading="lazy" />
            <div class="image-content">
                <div
                    class="bg-white/10 backdrop-blur-sm rounded-2xl p-4 lg:p-6 border border-white/20">
                    <h2 class="text-xl lg:text-2xl font-bold text-white mb-3">MAD-AI Platform</h2>
                    <p class="text-white/90 text-sm lg:text-base mb-4">
                        Gestiona y optimiza tus procesos con inteligencia artificial avanzada
                    </p>
                    <div
                        class="flex items-center justify-around gap-3 text-white/80 text-xs lg:text-sm">
                        <div class="flex items-center gap-2">
                            <div class="w-2 h-2 bg-successful-400 rounded-full"></div>
                            <span class="text-sm">Seguro</span>
                        </div>
                        <div class="flex items-center gap-2">
                            <div class="w-2 h-2 bg-successful-400 rounded-full"></div>
                            <span class="text-sm">Confiable</span>
                        </div>
                        <div class="flex items-center gap-2">
                            <div class="w-2 h-2 bg-successful-400 rounded-full"></div>
                            <span class="text-sm">Innovador</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

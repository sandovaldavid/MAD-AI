<form class="p-4 max-w-xl space-y-3" (ngSubmit)="submit()">
    <label class="block">
        <span>Nombre</span>
        <input
            class="w-full px-3 py-2 border rounded"
            [value]="name()"
            (input)="name.set($any($event.target).value)" />
    </label>
    <label class="block">
        <span>Nivel de acceso (1-5)</span>
        <input
            type="number"
            min="1"
            max="5"
            class="w-full px-3 py-2 border rounded"
            [value]="accessLevel()"
            (input)="accessLevel.set($any($event.target).value)" />
    </label>
    <label class="block">
        <span>Descripción</span>
        <textarea
            class="w-full px-3 py-2 border rounded"
            [value]="description()"
            (input)="description.set($any($event.target).value)"></textarea>
    </label>
    <button class="px-4 py-2 rounded bg-primary-600 text-white">Guardar</button>
</form>

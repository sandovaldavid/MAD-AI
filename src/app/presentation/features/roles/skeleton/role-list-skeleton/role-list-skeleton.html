<div class="role-skeleton">
    <!-- Role List Skeleton -->
    <div class="role-skeleton-header">
        <!-- Header skeleton for title and description -->
        <div class="skeleton-base skeleton-text w-48 h-8 mb-2"></div>
        <div class="skeleton-base skeleton-text w-80 h-5"></div>
    </div>

    <!-- Actions skeleton -->
    <div class="role-skeleton-actions">
        <div class="skeleton-base w-32 h-10 rounded-xl"></div>
        <div class="skeleton-base w-24 h-10 rounded-xl"></div>
    </div>

    <!-- Role cards skeleton -->
    <div class="role-skeleton-grid">
        @for (item of skeletonItems; track $index) {
        <div class="role-skeleton-card">
            <!-- Card header -->
            <div class="role-skeleton-card-header">
                <div class="skeleton-base w-12 h-12 rounded-xl"></div>
                <div class="role-skeleton-card-title">
                    <div class="skeleton-base skeleton-text w-24 h-6 mb-1"></div>
                    <div class="skeleton-base skeleton-text w-16 h-4"></div>
                </div>
            </div>

            <!-- Card content -->
            <div class="role-skeleton-card-content">
                <div class="skeleton-base skeleton-text w-full h-4 mb-2"></div>
                <div class="skeleton-base skeleton-text w-4/5 h-4 mb-3"></div>

                <!-- Stats skeleton -->
                <div class="role-skeleton-stats">
                    <div class="role-skeleton-stat">
                        <div class="skeleton-base skeleton-text w-8 h-5 mb-1"></div>
                        <div class="skeleton-base skeleton-text w-12 h-3"></div>
                    </div>
                    <div class="role-skeleton-stat">
                        <div class="skeleton-base skeleton-text w-8 h-5 mb-1"></div>
                        <div class="skeleton-base skeleton-text w-12 h-3"></div>
                    </div>
                </div>
            </div>

            <!-- Card actions -->
            <div class="role-skeleton-card-actions">
                <div class="skeleton-base w-16 h-8 rounded-lg"></div>
                <div class="skeleton-base w-8 h-8 rounded-lg"></div>
            </div>
        </div>
        }
    </div>
</div>

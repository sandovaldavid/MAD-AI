<div class="chart-card">
    <h3 class="chart-title flex items-center gap-2">
        <fa-icon [icon]="['fas', 'user']" class="text-primary-500 text-xl"></fa-icon>
        Distribución por tipo de contrato
    </h3>
    <div class="chart-container">
        <canvas
            id="contractTypeChart"
            width="320"
            height="320"
            aria-label="Distribución por tipo de contrato"
            role="img"></canvas>
    </div>
    <div *ngIf="stats()?.employment_distribution as dist" class="legend-list">
        <div *ngFor="let key of Object.keys(dist); let i = index" class="legend-item">
            <span class="legend-color" [style.background]="getColor(i)"></span>
            <span class="legend-label">{{ key }}</span>
            <span class="legend-value">{{ dist[key] }}</span>
        </div>
    </div>
</div>

<div class="p-6 bg-gray-100 min-h-screen">
    <h1 class="text-3xl font-bold text-gray-800 mb-6">Resource Management Dashboard</h1>

    <!-- Stat Cards -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-6">
        <app-stat-card
            title="Total Human Resources"
            [value]="humanResourceCount()"
            icon="users"></app-stat-card>
        <app-stat-card
            title="Total Material Resources"
            [value]="materialResourceCount()"
            icon="box"></app-stat-card>
        <app-stat-card
            title="Absences"
            [value]="absenceCount()"
            icon="calendar-off"></app-stat-card>
        <app-stat-card
            title="Human Resource Utilization"
            [value]="humanUtilization()"
            icon="line-chart"
            unit="%"></app-stat-card>
    </div>

    <!-- Charts -->
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-6">
        <div class="bg-white p-6 rounded-lg shadow">
            <app-resource-type
                title="Resource Utilization"
                [data]="utilizationData()"></app-resource-type>
        </div>
        <div class="bg-white p-6 rounded-lg shadow">
            <h2 class="text-xl font-bold text-gray-800 mb-4">Tipos de Recursos</h2>
            <!-- Placeholder for another chart -->
        </div>
    </div>

    <!-- Resource Table -->
    <div class="bg-white p-6 rounded-lg shadow">
        <h2 class="text-xl font-bold text-gray-800 mb-4">Todos los Recursos</h2>
        <app-resources-table></app-resources-table>
    </div>
</div>

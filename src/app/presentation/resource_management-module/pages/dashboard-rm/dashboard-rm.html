<div class="p-6">
    <!--Butons to material and human resources-->
    <div class="flex justify-end gap-4 mb-6">
        <app-button
            variant="primary"
            (clicked)="navigateTo('/resource-management/material-resources/dashboard')">
            <fa-icon [icon]="['fas', 'boxes-stacked']"></fa-icon>
            <span>Recursos Materiales</span>
        </app-button>
        <app-button
            variant="secondary"
            (clicked)="navigateTo('/resource-management/human-resources/dashboard')">
            <fa-icon [icon]="['fas', 'users']"></fa-icon>
            <span>Recursos Humanos</span>
        </app-button>
    </div>

    <!-- Stat Cards -->
    <div class="mb-6">
        <app-resources-stats [stats]="resourceStats()"></app-resources-stats>
    </div>

    <!-- Charts -->
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-6">
        <app-resource-state [totals]="resourceTotals()"></app-resource-state>
        <app-resource-type [resourcesByType]="resourcesByType()"></app-resource-type>
    </div>

    <!-- Resource Table -->
    <div
        class="p-6 bg-white dark:bg-gray-800 rounded-lg shadow shadow-primary-100 dark:shadow-primary-800">
        <h2 class="text-2xl font-bold text-gray-800 dark:text-white mb-4">
            <fa-icon [icon]="['fas', 'list-ul']" class="chart-title-logo"></fa-icon>
            Todos los Recursos
        </h2>
        <app-resources-table></app-resources-table>
    </div>
</div>

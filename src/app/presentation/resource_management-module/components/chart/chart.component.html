<div class="chart-container">
    <div class="flex items-center gap-2 mb-4">
        @if (data().length > 0) {
        <app-chart-doughnut-icon />
        } @else {
        <app-chart-empty-icon />
        }
        <h3 class="chart-title">{{ title() }}</h3>
    </div>
    <div class="chart-wrapper">
        @if (data().length > 0) {
        <canvas
            baseChart
            [data]="doughnutChartData()"
            [options]="doughnutChartOptions"
            [type]="'doughnut'">
        </canvas>
        } @else {
        <div class="chart-empty-state text-center py-4">
            <p class="text-gray-500 mb-2">No hay datos de utilización para mostrar.</p>
            <canvas
                baseChart
                [data]="{
                    labels: ['Rec. Humanos', 'Rec. Materiales'],
                    datasets: [{ data: [0, 0], backgroundColor: '#e5e7eb' }]
                }"
                [options]="doughnutChartOptions"
                [type]="'doughnut'">
            </canvas>
        </div>
        }
    </div>
</div>

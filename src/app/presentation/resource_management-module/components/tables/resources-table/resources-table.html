<app-resources-filter (filterChange)="onFilterChange($event)"></app-resources-filter>

<div class="table-container">
    <table class="table">
        <thead class="table-header">
            <tr>
                <th>Nombre</th>
                <th>Categoria</th>
                <th>Tipo</th>
                <th>Estado</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            @for (resource of resources(); track resource.id) {
            <tr class="table-row">
                <td class="table-cell">
                    <p class="text-gray-900 dark:text-white whitespace-no-wrap">
                        {{ resource.name }}
                    </p>
                </td>
                <td class="table-cell">
                    <p class="text-gray-900 dark:text-white whitespace-no-wrap">
                        {{ resource.resource_category }}
                    </p>
                </td>
                <td class="table-cell">
                    <p class="text-gray-900 dark:text-white whitespace-no-wrap">
                        {{ resource.resource_type_name }}
                    </p>
                </td>
                <td class="table-cell">
                    <span class="status-badge" [ngClass]="'status-' + resource.availability_status">
                        <span class="status-badge-dot"></span>
                        <span class="relative">{{ resource.status_display }}</span>
                    </span>
                </td>
                <td class="table-cell">
                    <button class="action-button" aria-label="Edit resource">
                        <fa-icon [icon]="['fas', 'edit']"></fa-icon>
                    </button>
                    <button class="action-button ml-2" aria-label="Delete resource">
                        <fa-icon [icon]="['fas', 'trash']"></fa-icon>
                    </button>
                </td>
            </tr>
            } @empty {
            <tr>
                <td colspan="5" class="text-center py-10 text-gray-500 dark:text-gray-400">
                    No resources found.
                </td>
            </tr>
            }
        </tbody>
    </table>
</div>

<app-pagination
    [currentPage]="currentPage()"
    [totalPages]="totalPages()"
    [totalItems]="totalResources()"
    (pageChange)="onPageChange($event)">
</app-pagination>

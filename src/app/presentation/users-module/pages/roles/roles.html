<div class="roles-page">
    <div class="page-container">
        <!-- Page Header -->
        <div class="page-header">
            <div class="header-content">
                <div class="flex flex-col space-y-2">
                    <h1 class="page-title">Gestión de Roles</h1>
                    <p class="page-description">
                        Administra los roles del sistema, asigna permisos y controla el acceso de
                        los usuarios
                    </p>
                </div>
                <app-button
                    variant="ghost"
                    size="sm"
                    (click)="goBack()"
                    icon="arrow-left"
                    customClass="text-neutral-600 hover:text-primary-600 dark:text-neutral-400 dark:hover:text-primary-400">
                    Volver a Usuarios
                </app-button>
            </div>
        </div>

        <!-- Role Table Component -->
        <div class="content-section">
            <app-role-table></app-role-table>
        </div>
    </div>
</div>

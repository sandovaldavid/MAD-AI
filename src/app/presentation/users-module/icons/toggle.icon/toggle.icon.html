<svg
    [attr.width]="size()"
    [attr.height]="size()"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
    [class]="customClass() + ' toggle-icon ' + (isActive() ? 'active' : 'inactive')">
    <rect x="1" y="5" width="22" height="14" rx="7" ry="7"></rect>
    <circle [attr.cx]="isActive() ? 17 : 7" cy="12" r="3"></circle>
</svg>

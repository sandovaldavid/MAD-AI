<div
  class="view-toggle"
  [class.compact]="compact()"
  role="radiogroup"
  [attr.aria-label]="ariaLabel()"
  [attr.aria-describedby]="'view-toggle-help'">
  <div id="view-toggle-help" class="sr-only">Elige cómo mostrar los datos: Tarjetas o Tabla</div>
  <button
    class="toggle-btn"
    [class.toggle-btn--active]="isActive('cards')"
    (click)="selectView('cards')"
    [attr.aria-label]="'Tarjetas: Vista de tarjetas'"
    [attr.aria-pressed]="isActive('cards')"
    role="radio"
    type="button">
    <ui-icon name="grid" size="sm" />
    <span class="ml-1">Tarjetas</span>
  </button>
  <button
    class="toggle-btn"
    [class.toggle-btn--active]="isActive('table')"
    (click)="selectView('table')"
    [attr.aria-label]="'Tabla: Vista de tabla'"
    [attr.aria-pressed]="isActive('table')"
    role="radio"
    type="button">
    <ui-icon name="table" size="sm" />
    <span class="ml-1">Tabla</span>
  </button>
  @if (showLabel()) {
    <span class="toggle-label" aria-hidden="true">
      {{ getCurrentViewLabel() }}
    </span>
  }
</div>

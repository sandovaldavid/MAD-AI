<div [class]="containerClasses">
    @if (labelPosition() === 'left' && label()) {
    <div class="slide-toggle-label-container">
        <label [class]="labelClasses" [for]="'slide-toggle-' + label()">
            {{ label() }}
        </label>
        @if (showDescription() && description()) {
        <p [class]="descriptionClasses" [id]="'slide-toggle-desc-' + label()">
            {{ description() }}
        </p>
        }
    </div>
    }

    <div class="slide-toggle-wrapper">
        <button
            type="button"
            role="switch"
            [id]="'slide-toggle-' + label()"
            [attr.aria-checked]="value"
            [attr.aria-labelledby]="label() ? 'slide-toggle-label-' + label() : null"
            [attr.aria-describedby]="description() ? 'slide-toggle-desc-' + label() : null"
            [class]="toggleClasses"
            [disabled]="disabled()"
            (click)="onToggle()"
            (keydown)="onKeydown($event)">
            <!-- Background Track -->
            <span class="slide-toggle-track">
                <!-- Thumb/Handle -->
                <span class="slide-toggle-thumb" [class.slide-toggle-thumb-active]="value">
                    <!-- Optional check/cross icons -->
                    <span class="slide-toggle-icon">
                        @if (value) {
                        <svg class="slide-toggle-check" viewBox="0 0 12 12" fill="none">
                            <path
                                d="M3.5 6L5 7.5L8.5 4"
                                stroke="currentColor"
                                stroke-width="2"
                                stroke-linecap="round"
                                stroke-linejoin="round" />
                        </svg>
                        } @else {
                        <svg class="slide-toggle-cross" viewBox="0 0 12 12" fill="none">
                            <path
                                d="M4 4L8 8M8 4L4 8"
                                stroke="currentColor"
                                stroke-width="2"
                                stroke-linecap="round"
                                stroke-linejoin="round" />
                        </svg>
                        }
                    </span>
                </span>
            </span>

            <!-- Optional ON/OFF labels for large size -->
            @if (showLabels() && size() === 'lg') {
            <span class="slide-toggle-labels">
                <span class="slide-toggle-label-on" [class.slide-toggle-label-visible]="value"
                    >ON</span
                >
                <span class="slide-toggle-label-off" [class.slide-toggle-label-visible]="!value"
                    >OFF</span
                >
            </span>
            }
        </button>
    </div>

    @if (labelPosition() === 'right' && label()) {
    <div class="slide-toggle-label-container">
        <label
            [class]="labelClasses"
            [for]="'slide-toggle-' + label()"
            [id]="'slide-toggle-label-' + label()">
            {{ label() }}
        </label>
        @if (showDescription() && description()) {
        <p [class]="descriptionClasses" [id]="'slide-toggle-desc-' + label()">
            {{ description() }}
        </p>
        }
    </div>
    }
</div>

<div class="input-container">
    @if (label()) {
    <label
        [for]="inputId()"
        class="input-label"
        [class.input-label-required]="required()"
        [class.input-label-disabled]="disabled()">
        {{ label() }}
        @if (required()) {
        <span class="input-required-indicator">*</span>
        }
    </label>
    }

    <input
        [id]="inputId()"
        [name]="name()"
        [type]="type()"
        [placeholder]="placeholder()"
        [value]="internalValue()"
        [disabled]="disabled()"
        [readonly]="readonly()"
        [required]="required()"
        [autocomplete]="autocomplete()"
        [attr.maxlength]="maxLength()"
        [attr.minlength]="minLength()"
        [pattern]="pattern()"
        [class]="inputClasses()"
        [attr.aria-invalid]="hasError()"
        [attr.aria-describedby]="helperText() || errorMessage() ? inputId() + '-description' : null"
        (input)="onInput($event)"
        (focus)="onFocus()"
        (blur)="onBlur()"
        (keydown)="onKeyDown($event)" />

    @if (errorMessage()) {
    <div
        [id]="inputId() + '-description'"
        class="input-message input-error-message"
        role="alert"
        aria-live="polite">
        {{ errorMessage() }}
    </div>
    } @else if (showHelperText()) {
    <div [id]="inputId() + '-description'" class="input-message input-helper-text">
        {{ helperText() }}
    </div>
    }
</div>
